version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apex_ledger_db
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex_password
      POSTGRES_DB: apex_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
